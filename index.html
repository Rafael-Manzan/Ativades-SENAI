<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixas</title>
  </head>
  <style>
    html {
      border: 1px solid violet;
    }
    body {
      border: 1px solid deeppink;
    }
    .bruh {
      border: 1px solid purple;
      padding: 5px;
      background-color: aliceblue;
      margin: 50px;
      text-align: center;
      background: linear-gradient(to right, aqua, yellow);
      text-transform: lowercase;
    }
    span {
        border: 1px solid deeppink;
        margin: 100px;
        padding: 1%;
        text-align: left;
        background-color: aqua;
        border-radius: 1000%;
    }
  </style>
  <body>
    <h1 class="bruh">Caixas</h1>
    <span>Caixas</span>
    <span>Caixas</span>
    <span>Caixas</span>
    <span>Caixas</span>
    <span>Caixas</span>
  </body>
</html>
